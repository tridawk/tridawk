<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Runner</title>
<link rel="stylesheet" href="games.css">
</head>
<body>
    <div class="score-board">
        <span>DIST: <span id="runnerScore">0</span>m</span>
        <span style="color:var(--cyan-accent)">BEST: <span id="runnerBest">0</span>m</span>
    </div>
    <canvas id="runnerCanvas" class="game-canvas" width="220" height="390" tabindex="0"></canvas>
    <div class="game-hint">Click to play with <br>[ Left / Right Arrows to switch lanes ]</div>

    <div id="runner-controls" class="mobile-controls disabled-controls">
        <div class="touch-row">
            <div class="touch-btn" style="width: 80px;" onclick="handleInput('ArrowLeft')">◄ LEFT</div>
            <div class="touch-btn" style="width: 80px;" onclick="handleInput('ArrowRight')">RIGHT ►</div>
        </div>
    </div>

<script>
const rCanvas = document.getElementById("runnerCanvas");
const rCtx = rCanvas.getContext("2d");
const lanes = [45, 102, 159];
let targetLane = 1, playerX = lanes[1];
let runnerObstacles = [], runnerInterval = null, runnerScore = 0, runnerBest = 0, lastSpawnY = -150, playing = false, isDead = false;
let inputQueue = [];

function handleInput(keyName) {
    if (isDead) return;
    if (inputQueue.length < 2) {
        inputQueue.push(keyName);
    }
}

function processInput() {
    if (inputQueue.length === 0) return;
    const key = inputQueue.shift();
    if (key === "ArrowLeft" && targetLane > 0) targetLane--;
    if (key === "ArrowRight" && targetLane < 2) targetLane++;
}

function drawLanes(dimmed = false) {
    rCtx.fillStyle = dimmed ? "#050508" : "#000"; 
    rCtx.fillRect(0, 0, rCanvas.width, rCanvas.height);
    
    rCtx.strokeStyle = dimmed ? "#11111a" : "#1a1a2e";
    rCtx.lineWidth = 2;
    rCtx.beginPath();
    rCtx.moveTo(76, 0); rCtx.lineTo(76, 390);
    rCtx.moveTo(144, 0); rCtx.lineTo(144, 390);
    rCtx.stroke();
}

function drawScene(dimmed = false, flashObs = null, flashOn = true) {
    drawLanes(dimmed);

    runnerObstacles.forEach(obs => {
        const isHit = (flashObs && obs === flashObs);
        if (isHit && flashOn) {
            rCtx.fillStyle = "#ff0033"; 
        } else {
            rCtx.fillStyle = dimmed ? "#44111d" : "#ff2a5f";
        }
        rCtx.fillRect(lanes[obs.lane], obs.y, 16, 22);
    });

    rCtx.fillStyle = dimmed ? "#333344" : "#00f0ff";
    rCtx.fillRect(playerX, 330, 16, 20);
}

function triggerFlashAnimation(hitObs) {
    let flashes = 0;
    const flashInterval = setInterval(() => {
        const flashOn = (flashes % 2 === 0);
        drawScene(true, hitObs, flashOn);

        flashes++;
        if (flashes >= 6) { 
            clearInterval(flashInterval);
            if (playing) {
                resetRunnerState();
                runnerInterval = setInterval(runRunner, 25);
            }
        }
    }, 100);
}

function resetRunnerState() {
    isDead = false;
    targetLane = 1;
    playerX = lanes[1];
    runnerObstacles = [];
    runnerScore = 0;
    lastSpawnY = -150; 
    inputQueue = [];
    document.getElementById("runnerScore").innerText = 0;
    drawScene(false);
}

function resetRunner(hitObs) {
    isDead = true;
    clearInterval(runnerInterval);

    if (runnerScore > runnerBest) { 
        runnerBest = runnerScore; 
        document.getElementById("runnerBest").innerText = runnerBest; 
    }

    triggerFlashAnimation(hitObs);
}

function runRunner() {
    if (isDead) return;

    processInput();

    runnerScore += 1;
    document.getElementById("runnerScore").innerText = runnerScore;

    let currentSpeed = 4.0 + Math.min(8, Math.floor(runnerScore / 100) * 0.5);
    let minGap = 120; 

    lastSpawnY += currentSpeed;
    if (lastSpawnY > minGap) {
        let availableLanes = [0, 1, 2];
        let countToSpawn = Math.random() < 0.4 ? 2 : 1;
        for (let i = 0; i < countToSpawn; i++) {
            let randIndex = Math.floor(Math.random() * availableLanes.length);
            let chosenLane = availableLanes.splice(randIndex, 1)[0];
            runnerObstacles.push({ lane: chosenLane, y: -30 });
        }
        lastSpawnY = 0;
    }

    let targetX = lanes[targetLane];
    playerX += (targetX - playerX) * 0.5;

    for (let i = runnerObstacles.length - 1; i >= 0; i--) {
        let obs = runnerObstacles[i];
        obs.y += currentSpeed;

        let obsCenterX = lanes[obs.lane] + 8;
        let playerCenterX = playerX + 8;
        if (obs.y > 315 && obs.y < 352 && Math.abs(playerCenterX - obsCenterX) < 10) {
            resetRunner(obs);
            return;
        }

        if (obs.y > 410) runnerObstacles.splice(i, 1);
    }

    drawScene(false);
}

rCanvas.addEventListener("click", () => {
    clearInterval(runnerInterval);
    playing = true;
    rCanvas.focus();
    resetRunnerState();
    document.getElementById("runner-controls").classList.remove('disabled-controls');
    runnerInterval = setInterval(runRunner, 25);
});

window.addEventListener("keydown", e => {
    if (!playing) return;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault();
    handleInput(e.key);
});

resetRunnerState();
</script>
</body>
</html>
