<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIDAWK</title>
    <meta name="description" content="Sitio oficial de Tridawk. Videojuegos, mods y proyectos indie.">
    <style>
        :root {
            --bg-color: #08080a;
            --text-color: #d0d0d0;
            --accent-color: #ff3366;
            --border-color: #222;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 650px;
            width: 100%;
            padding: 50px 20px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 2.8rem;
            letter-spacing: 6px;
            color: #fff;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 40px;
        }

        .section {
            margin-bottom: 40px;
            border-top: 1px solid var(--border-color);
            padding-top: 25px;
        }

        h2 {
            font-size: 1rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        a.link-button {
            display: block;
            background: #111;
            color: #fff;
            padding: 12px 20px;
            text-decoration: none;
            border: 1px solid var(--border-color);
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        a.link-button:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: #151518;
        }

        /* Estilos para el minijuego de Snake */
        #snake-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
        }

        canvas {
            border: 2px solid var(--border-color);
            background-color: #000;
            max-width: 100%;
            height: auto;
        }

        .score {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 10px;
        }

        .game-hint {
            font-size: 0.75rem;
            color: #555;
            margin-top: 8px;
        }

        footer {
            margin-top: auto;
            padding: 30px 0;
            font-size: 0.75rem;
            color: #444;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tridawk</h1>
        <div class="subtitle">Indie Game Developer & Modder</div>

        <!-- ENLACES -->
        <div class="section">
            <h2>Enlaces & Proyectos</h2>
            <div class="links-grid">
                <a class="link-button" href="https://tridawk.itch.io" target="_blank">Itch.io (Juegos)</a>
                <a class="link-button" href="https://www.nexusmods.com/profile/tridawk/mods?gameId=4205" target="_blank">Nexus Mods</a>
                <a class="link-button" href="https://mod.io/u/tridawk/" target="_blank">Mod.io</a>
                <a class="link-button" href="https://www.tiktok.com/@tridawk" target="_blank">TikTok</a>
            </div>
        </div>

        <!-- MINIJUEGO DE SNAKE -->
        <div class="section">
            <h2>Arcade / Zona de vicio</h2>
            <div id="snake-container">
                <div class="score">Puntuación: <span id="score">0</span></div>
                <canvas id="snakeBoard" width="300" height="300"></canvas>
                <div class="game-hint">Usa las flechas del teclado para jugar</div>
            </div>
        </div>

        <footer>
            &copy; 2026 TRIDAWK. ALL RIGHTS RESERVED.
        </footer>
    </div>

    <!-- SCRIPT DEL MINIJUEGO SNAKE -->
    <script>
        const canvas = document.getElementById("snakeBoard");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameInterval;
        let gameStarted = false;

        function gameLoop() {
            update();
            if (isGameOver()) {
                alert("¡Game Over! Puntuación: " + score);
                resetGame();
                return;
            }
            clearCanvas();
            drawFood();
            drawSnake();
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            generateFood();
            gameStarted = false;
            clearInterval(gameInterval);
        }

        function clearCanvas() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            ctx.fillStyle = "#ff3366";
            snake.forEach(part => {
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
        }

        function drawFood() {
            ctx.fillStyle = "#00ffff";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function update() {
            if (dx !== 0 || dy !== 0) {
                moveSnake();
            }
        }

        function isGameOver() {
            const head = snake[0];
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            return false;
        }

        window.addEventListener("keydown", e => {
            if (!gameStarted && ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
                gameStarted = true;
                gameInterval = setInterval(gameLoop, 100);
            }
            switch (e.key) {
                case "ArrowUp":
                    if (dy === 0) { dx = 0; dy = -1; }
                    break;
                case "ArrowDown":
                    if (dy === 0) { dx = 0; dy = 1; }
                    break;
                case "ArrowLeft":
                    if (dx === 0) { dx = -1; dy = 0; }
                    break;
                case "ArrowRight":
                    if (dx === 0) { dx = 1; dy = 0; }
                    break;
            }
        });

        generateFood();
        clearCanvas();
        drawSnake();
        drawFood();
    </script>
</body>
</html>
